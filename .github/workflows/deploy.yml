name: Build and deploy API
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B verify
  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        if: env.EC2_HOST != ''
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "Dockerfile,docker-compose.yml,pom.xml,src"
          target: /home/ubuntu/sistema-avaliacoes-backend
      - uses: appleboy/ssh-action@v1.2.0
        if: env.EC2_HOST != ''
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AUTH0_ISSUER_URI: ${{ secrets.AUTH0_ISSUER_URI }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          CORS_ALLOWED_ORIGIN: ${{ secrets.CORS_ALLOWED_ORIGIN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: POSTGRES_PASSWORD,AUTH0_ISSUER_URI,AUTH0_AUDIENCE,CORS_ALLOWED_ORIGIN
          script: |
            cd /home/ubuntu/sistema-avaliacoes-backend
            printf 'POSTGRES_PASSWORD=%s\nAUTH0_ISSUER_URI=%s\nAUTH0_AUDIENCE=%s\nCORS_ALLOWED_ORIGIN=%s\n' "$POSTGRES_PASSWORD" "$AUTH0_ISSUER_URI" "$AUTH0_AUDIENCE" "$CORS_ALLOWED_ORIGIN" > .env
            docker compose up -d --build
