spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/avaliacoes}
    username: ${DATABASE_USERNAME:avaliacoes}
    password: ${DATABASE_PASSWORD:avaliacoes}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI}
          audiences: ${AUTH0_AUDIENCE}
server:
  error:
    include-message: always
